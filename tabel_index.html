<!DOCTYPE html>
<html lang="id">
    <head>
        <title>Membuat Tabel</title>
        <style>
            body{
                font-family:Arial, sans-serif;
                background-color: #f5f5f5;
                padding: 30px;
            }

            h1{
                text-align: center;
            }

            .container{
                display:flex;
                flex-wrap:wrap;
                justify-content:space-between;
                gap: 50px;
            }

            .box{
                text-align: center;
            }

            table{
                border-collapse:collapse;
                background-color:white;
            }

            td{
                border: 2px solid black;
                width: 70px;
                height: 60px;
                text-align: center;
                vertical-align:middle;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Latihan Membuat Table</h1>
        <div class="container">
    <!--=============-->
    <!--Tabel Pertama-->
    <!--=============-->

       <div class="box">
        <h3>Tabel Ke-1</h3>
       <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
       </table>
       </div>

    <!--=============-->
    <!--Tabel Ke-2 --->
    <!--=============-->

       <div class="box">
        <h3>Table ke-2</h3>
        <table>
            <tr>
                <td>1</td>

            <!-- tanda "2" untuk menggabungakan 2 kolom-->
                <td colspan="2">2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>
            <tr>
                <td>6</td>
                <td>7</td>
                <td>8</td>
            </tr>
        </table>
       </div>


    <!--=============-->
    <!--Tabel Ke-3 --->
    <!--=============-->

        <div class="box">
            <h3>Table Ke-3</h3>
            <table>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                <!-- tanda "4" berfungsi untuk menggabungkan 3 kolom-->
                    <td colspan="3">4</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                </tr>
            </table>
        </div>

    <!--=============-->
    <!--Tabel Ke-4 --->
    <!--=============-->

         <div class="box">
            <h3> Table Ke-4</h3>
            <table>
                <tr>
                    <td>1</td>
                <!--tanda "2" berfungsi sebagai menggabungkan 2 kolom -->
                    <td colspan="2">2</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                </tr>
                <tr>
                <!--Tabel 6 menggabungkan 2 kolom-->
                    <td colspan="2">6</td>
                    <td>7</td>
                </tr>
            </table>
         </div>


    <!--============-->
    <!---Tabel Ke-5-->
    <!--============-->

      <div class="box">
        <h3>Tabel Ke-5</h3>
         <table>
                <tr>
                    <!-- 1 menggabungkan 2 baris -->
                    <td rowspan="2">1</td>

                    <td>2</td>

                    <!-- 4 menggabungkan 2 baris -->
                    <td rowspan="2">4</td>
                </tr>

                <tr>
                    <td>3</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                </tr>
        </table>
      </div>
    </body>
</html>
